# .gitlab-ci.yml — canonical CI for speckit-managed projects (ADR-0025).
#
# HARD RULE: do NOT add an `image` declaration anywhere in this file. The
# GitLab runner's default environment is managed centrally and already
# provides every toolchain this pipeline needs; per-job runtime pinning is
# forbidden by ADR-0025 (runner-managed).

stages:
  - lint
  - test
  - validate
  - release
  - publish

workflow:
  rules:
    # Release pipelines: tags shaped like v1.2.3.
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    # Merge request pipelines.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Avoid a duplicate branch pipeline while an MR is open for the branch.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Branch pipelines.
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  script:
    - make lint

test:
  stage: test
  script:
    - make check

validate:
  stage: validate
  script:
    - speckit validate

# The optimized build is the gated one (P-08); `dev` above is the fast loop.
# A warning is an error here, so this job is what proves the tree warning-clean.
optimized:
  stage: release
  script:
    - cmake --preset release
    - cmake --build --preset release
    - ctest --preset release

publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Automated release for $CI_COMMIT_TAG'
